# ONLY TEST IN LOCAL
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    # Định nghĩa định dạng file và log (giữ mặc định)
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # -------------------------------------------------------------
    # 1. CẤU HÌNH CỤM SERVER MICROSERVICE (UPSTREAM)
    # -------------------------------------------------------------
    upstream my_nest_services {
        # Mặc định Nginx sẽ chia đều request theo thuật toán Round-Robin vào 3 cổng này
        server 127.0.0.1:3000;
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        
        # Mẹo mở rộng: Nếu muốn server 3000 gánh tải gấp đôi 2 server còn lại, 
        # bạn có thể thêm trọng số weight như sau:
        # server 127.0.0.1:3000 weight=2;
    }

    # -------------------------------------------------------------
    # 2. CẤU HÌNH API GATEWAY (SERVER HỨNG REQUEST CHÍNH)
    # -------------------------------------------------------------
    server {
        # Nginx sẽ lắng nghe ở cổng 8000 (Bạn có thể đổi thành cổng khác nếu thích)
        listen       8000;
        server_name  localhost;

        # Cứ gọi vào địa chỉ gốc http://localhost:8000/ là sẽ chạy vào đây
        location / {
            # Bắn ngược request sang cụm upstream "my_nest_services" đã định nghĩa ở trên
            proxy_pass http://my_nest_services;

            # --- GIỮ NGUYÊN DANH TÍNH DOMAIN ĐÍCH (changeOrigin: true) ---
            proxy_set_header Host $host;

            # --- GIỮ NGUYÊN DANH TÍNH CLIENT GỐC (xfwd: true) ---
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cấu hình thời gian chờ kết nối (Nếu quá 3 giây server không phản hồi thì coi như sập)
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # Cấu hình trang hiển thị lỗi mặc định của Nginx nếu hệ thống có sự cố
        error_page   500 502 503 504  /5x.html;
        location = /5x.html {
            root   html;
        }
    }
}
